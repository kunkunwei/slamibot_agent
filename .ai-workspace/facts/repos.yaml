    image: registry.cn-shanghai.aliyuncs.com/slamibot/nav3d_d360:1.0
    container: d360_navigation_container
    local_path: "/home/jetson/docker_ws_backup -> /workspace/movebase3d_web"
    default_branch: N/A
    tech_stack: [ros1, noetic]         # 用 roscore/rosnode/rostopic，ROS1
    web: "http://192.168.31.132:9000 或 192.168.117.6:9000（admin/admin）"
    status: NEEDS_CONFIRMATION
    note: |
      无源码（编译好的二进制镜像，无法编译）。MID-360 + FAST-LIO + global_planner(带 MAC 授权校验)
      + local_planner + web_api。原本 DDS 控制，我方新增 WebRTC 控制链路。
      MAC 绑定：雷达 00:e0:9a:2f:15:e6 + usb转网口 9c:69:d3:1e:3e:96。

