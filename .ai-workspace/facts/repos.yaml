# 事实源：Git 仓库清单
# 状态取值：CONFIRMED（已确认）/ NEEDS_CONFIRMATION（待确认）/ UNKNOWN（未知）/ TODO（待办）
# 说明：本机尚未 clone 的仓库，local_path 标 UNKNOWN，clone 命令见 clone_cmd。
# 扫描日期：2026-08-16

repositories:
  - id: navigation-ros1-d360
    name: Scout_mini_navigation（d360_nav2D）
    role: 当前导航系统（CURRENT）—— 松灵 Scout mini 2D 导航
    remote_url: https://gitee.com/electech6/d360_nav2D.git
    remote_host: gitee
    local_path: "F:\\d360_nav2D"
    default_branch: master             # 已通过 git 确认
    branches:                          # 已通过 git 确认
      - name: master                   # 默认分支（HEAD）
      - name: feat/point-arrival-capture   # 到达点采集（功能分支）
      - name: voice                    # 语音（功能分支）
    tech_stack: [ros1, noetic, ubuntu-20.04]
    status: CONFIRMED
    clone_cmd: "git clone https://gitee.com/electech6/d360_nav2D.git"

  - id: navigation-ros2
    name: 导航（ROS2，未来目标）
    role: 未来目标架构（TARGET）
    remote_url: UNKNOWN
    local_path: UNKNOWN
    default_branch: UNKNOWN
    tech_stack: [ros2, ubuntu-22.04]
    status: UNKNOWN

  - id: frontend-app
    name: SLAMIBotApp（前端 APP）
    role: 前端控制/监控 APP，通过 rosbridge 与导航通信
    remote_url: https://github.com/electech6/SLAMIBotApp.git
    remote_host: github
    local_path: UNKNOWN                # 本机尚未 clone
    default_branch: main               # 已通过 git ls-remote 确认
    branches:                          # 已通过 git ls-remote 确认
      - name: main
      - name: codex/native-compose-filament   # 提示：可能为 Android Jetpack Compose + Filament 渲染，待 clone 确认
    tech_stack: [app, rosbridge-client]  # 框架待 clone 后确认
    status: NEEDS_CONFIRMATION
    clone_cmd: "git clone https://github.com/electech6/SLAMIBotApp.git"

  - id: stm32
    name: slamibot_stm32（STM32 固件）
    role: 底层固件 / 下位机
    remote_url: https://github.com/electech6/slamibot_stm32.git
    remote_host: github
    local_path: "F:\\slamibot_stm32"
    branches:
      - name: bootloader
        role: IAP 在线升级
      - name: d360
        role: 产品主要功能
    tech_stack: [embedded, stm32, c]
    status: CONFIRMED

  - id: backend
    name: 后端服务
    role: 前端与机器人/导航之间的后端接口（若存在独立后端）
    remote_url: UNKNOWN
    local_path: UNKNOWN
    tech_stack: UNKNOWN
    status: UNKNOWN

  - id: deployment
    name: 部署 / Docker
    role: Docker 镜像、compose、部署脚本
    remote_url: UNKNOWN
    local_path: UNKNOWN
    tech_stack: [docker]
    status: UNKNOWN
