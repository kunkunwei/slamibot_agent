    tech_stack: [ros2, humble, ubuntu-22.04]
    status: CONFIRMED
    clone_cmd: "git clone https://gitee.com/lion-king2025/3d_nav.git"

  - id: navigation-3d-external
    name: 外协 3D 导航（第三方/外包，movebase3d_web）
    role: 外协开发的 3D 导航（与自研 3d_nav 区分，两条不同来源）
