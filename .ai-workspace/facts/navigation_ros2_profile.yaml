# 事实源：ROS2 导航 —— 自研 3D 导航（kn_nav，Go2 机器狗）
# 状态取值：CONFIRMED / NEEDS_CONFIRMATION / UNKNOWN / TODO
# 来源：gitee 3d_nav 仓库 + 同事文档「自研3D导航.md」（2026-08）

navigation_ros2:
  project: KN 导航工作区（kn_nav，gitee 仓库 3d_nav）
  robot: [Unitree Go2]
  host_os: Ubuntu 20.04.6 LTS（aarch64，ROS1，跑雷达驱动）
  container_os: Ubuntu 22.04.5 LTS（aarch64，ROS2 Humble）
  ros_distro: humble
  ros_domain_id: 0
  build_tool: "colcon build --symlink-install"

  # 关键：宿主机是 ROS1，导航在 ROS2 容器里，靠 ros1_bridge 打通话题
  ros1_ros2_bridge:
    image: "ros:foxy-ros1-bridge（Noetic + Foxy）"
    cmd: "ros2 run ros1_bridge dynamic_bridge --bridge-all-topics"
    note: 宿主机的 roscore + 雷达(ROS1)话题 → 桥接 → ROS2 导航容器

  container:
    name: kn_nav_container
    image: "kn_nav:v1（linux/arm64）"
    network: host
    mounts:
      - "/home/jetson/kn_nav -> /workspace/kn_nav_ws"
      - "/dev/shm -> /dev/shm"

  # 输入（来自 ROS1 桥接）
  radar_topic: /livox/lidar/pointcloud
  imu_topic: /livox/imu
  map: clean_data.pcd + clean_data.pickle

  # 5 层控制链路（用户发目标 → 狗运动）
  control_chain:
    - { layer: "① PCT 全局规划", file: "src/PCT_planner/scripts/run_ros2_global_planner.py", in: "/goal_pose + TF map→base_link", out: "/pct_path (nav_msgs/Path)" }
    - { layer: "② pct_scan_coordinator", file: "src/pct_scan_navigation/src/pct_scan_coordinator.cpp", in: "/pct_path", out: "/scan_planner/waypoints（等距采样 waypoint_spacing=1.0m）" }
    - { layer: "③ SCAN-Planner FSM", file: "src/SCAN-Planner/src/planner/plan_manage/src/scan_replan_fsm.cpp", in: "waypoints + /Odometry_open3d + /scan_map", out: "/planning/bspline" }
    - { layer: "④ closed_loop_controller", file: "src/SCAN-Planner/src/planner/plan_manage/src/closed_loop_controller.cpp", in: "bspline + /Odometry_open3d", out: "/cmd_vel + /planning/go2_execution_frozen", params: "kp_pos=0.8 kp_yaw=1.5 max_vx=0.75 max_vy=0.35 max_vyaw=1.0 heading_error_threshold=0.8rad" }
    - { layer: "⑤ go2_cmd_vel_bridge", file: "src/pct_scan_navigation/scripts/go2_cmd_vel_bridge.py", in: "/cmd_vel", out: "WebRTC Move(vx,vy,vyaw) → Go2" }

  # Go2 安全控制器（go2_safety_controller.py）
  safety:
    state_machine: "DISABLED → ARMED（odometry 心跳 + sport_state 心跳 + StopMove 成功）→ 接受 /cmd_vel"
    tick: 20Hz
    timeouts: { odometry: 1.0s, sport_state: 0.5s, command: 0.3s }
    disarm_conditions: [odometry 心跳丢失, sport_state 心跳丢失, cmd_vel 超时, cmd_vel 含 NaN/Inf, Move 调用失败]
    bridge_config:
      robot_ip: "192.168.123.161"      # Go2 STA 模式 IP
      max_vx: 0.40
      max_abs_vyaw: 1.0
      max_linear_acceleration: 1.0
      max_yaw_acceleration: 1.2

  # 定位 / 规划
  localization: [fast_lio, open3d_loc]
  global_planner: pct_planner           # PCT 三维全局规划（GTSAM）
  local_planner: scan_planner           # SCAN-Planner（B-spline 避障）

  # 关键 Topic（CONFIRMED，来自 service.md + 自研文档）
  topics:
    - { name: /pct_path,               note: PCT 全局路径 }
    - { name: /pct_scan_navigation/status, note: 导航链路状态 }
    - { name: /navigation_status,      note: 导航状态（唯一可信源 scan_planner_node） }
    - { name: /current_map,            note: 当前地图（transient local） }
    - { name: /localization_status,    note: 定位状态（TRACKING/TRACKING_LOST/INIT_SUCCESS） }
    - { name: /Odometry_open3d,        note: open3d_loc 里程计（body_pose） }
    - { name: /scan_map,               note: SCAN 局部点云 }
    - { name: /go2_cmd_vel_bridge/armed,      note: 是否使能（latched） }
    - { name: /go2_cmd_vel_bridge/safe_cmd_vel, note: 限幅后输出（监控） }
    - { name: /planning/bspline,       note: B-spline 轨迹 }
  services:
    - { name: /switch_map,             type: pct_scan_navigation/srv/SwitchMap }
    - { name: /restart_navigation,     type: pct_scan_navigation/srv/RestartNavigation }
    - { name: /open3d_loc/relocalize,  type: open3d_loc/srv/Relocalize }
    - { name: /open3d_loc/get_pose,    type: open3d_loc/srv/GetPose }
    - { name: /open3d_loc/publish_goal, type: open3d_loc/srv/PublishGoal }
    - { name: /go2_cmd_vel_bridge/enable, type: std_srvs/srv/SetBool }
    - { name: /map_save,               type: std_srvs/srv/Trigger }
  tf_frame: map
  nav_states: [WAITING_GOAL, IDLE, NAVIGATING, AVOIDING, GOAL_REACHED, BLOCKED, FAILED, MAP_SWITCHING]

  launch:
    main: "ros2 launch pct_scan_navigation local_pct_scan_navigation.launch.py config_profile:=unitree_go2 start_open3d_loc:=true start_pct_planner:=true start_go2_bridge:=false navigation_mode:=2"
    rviz: "rviz2 -d src/pct_scan_navigation/config/unitree_go2/kn_nav.rviz（Fixed Frame=map）"

  # 进度（来自自研3D文档）
  progress:
    done: [编译环境, ros1/ros2 话题互通, Go2 WebRTC 控制, 全局路径, /cmd_vel 输出, 目标点大致方向移动]
    todo: [安全控制器未充分测试, 导航到目标点停不下来/越走越歪, 跨楼层路径未测试, 跨楼层导航暂不可]

  dds_rmw: UNKNOWN
  interface_docs: [src/service.md, src/web_api/API.md]
  status: CONFIRMED
  note: 自研 3D 导航。与 ROS1（Scout mini 2D）严格隔离；与外协 3D 导航是两条不同来源。
