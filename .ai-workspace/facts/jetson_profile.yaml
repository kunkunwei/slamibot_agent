  ssh_hotspot:
    host: 192.168.117.6
    port: 22
    user: jetson
    status: NEEDS_CONFIRMATION
    priority: SECONDARY
  ssh_video_link:
    host: 192.168.144.87
    port: 22
    user: jetson
    status: NEEDS_CONFIRMATION
