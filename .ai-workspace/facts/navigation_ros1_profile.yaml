# 事实源：ROS1 导航（CURRENT）—— Scout mini 2D 导航
# 状态取值：CONFIRMED / NEEDS_CONFIRMATION / UNKNOWN / TODO
# 本文件只记录 ROS1 事实；ROS2 事实见 navigation_ros2_profile.yaml，禁止混写。
# 来源：2026-08-19 只读分析仓库并核验 Jetson 运行容器

navigation_ros1:
  project: Scout_mini_navigation
  ubuntu: "20.04"                         # CONFIRMED：Dockerfile 注释「Ubuntu 20.04 + ROS Noetic」
  ros_distro: noetic                      # CONFIRMED：Dockerfile FROM ros:noetic-ros-base
  build_tool: "catkin_make install"       # CONFIRMED：快速操作手册「catkin_make install -j6」
  workspace: /Scout_mini_navigation       # 容器内路径；宿主机 /home/jetson/Scout_mini_navigation

  # 定位 / 规划 / 建图
  localization: [amcl, fastlio_gravity_align]  # FAST_LIO/FAST_LIO_SAM/FAST_LIO_LOCALIZATION 被 CATKIN_IGNORE
  planner: teb_local_planner              # Dockerfile 安装 ros-noetic-teb-local-planner
  mapping: [cartographer, gmapping, fastlio]  # 见 src/my_nav/mapping_launch/

  # 关键 Topic（CONFIRMED）
  topics:
    - { name: /clock,           source: firmware-sensors 容器, msg_type: rosgraph_msgs/Clock }
    - { name: /livox/lidar,     source: firmware-sensors 容器（Livox）, msg_type: NEEDS_CONFIRMATION }
    - { name: /livox/imu,       source: firmware-sensors 容器（Livox）, msg_type: NEEDS_CONFIRMATION }
    - { name: /cmd_vel,         sink: Scout mini 底盘（经 CAN can0）, msg_type: geometry_msgs/Twist }
  nodes: []                               # TODO：从 launch 文件完整回填
  services:
    - { name: NEEDS_CONFIRMATION, type: nav_api/NavCommand }  # 定义见 src/nav_api/srv/NavCommand.srv
  tf_tree: []                             # TODO

  parameters: {}                          # TODO：move_base/代价地图/TEB 参数（src/my_nav/config、config/tuned2）

  launch:
    bringup: src/my_nav/launch/my_nav_launch.launch          # 待确认主入口
    navigation: src/my_nav/launch/move_base_tuned2.launch
    lidar_to_scan: src/my_nav/launch/lidar_to_scan.launch
    fastlio_loc_2d: src/my_nav/launch/fastlio_localization_with_2d_nav.launch
    mapping: src/my_nav/mapping_launch/（cartographer/gmapping/fastlio）

  rosbridge:
    package: rosbridge_server
    client_port: 9090                     # core 提供；Android APP 与 WEB 使用
    client_node: /rosbridge_websocket
    nav_api_internal_port: 19090          # scout-nav 提供；仅 FastAPI/nav_api 使用
    nav_api_internal_node: /scout_nav_rosbridge
    host: 127.0.0.1

  docker:
    active_image: scout-nav:dual-rosbridge-20260819
    rollback_container: scout-nav-pre-dual-20260819
    containers: [core, firmware-sensors, scout-nav, ota_web]
    network: host
    can: "can0 500000 bit/s"
    entrypoint: /usr/local/bin/nav-api-entrypoint
    runtime_2026_08_19:
      ports_listening: [80, 5000, 9090, 19090]
      health_rosbridge_connected: true
      nginx_rosbridge_upstream: 9090

  dependencies:                           # 来自 Dockerfile apt 安装
    - ros-noetic-rosbridge-server
    - ros-noetic-amcl
    - ros-noetic-move-base
    - ros-noetic-teb-local-planner
    - ros-noetic-pcl-ros / pcl-conversions
    - ros-noetic-tf / tf2-sensor-msgs
    - livox_ros_driver2
    - scout_ros / ugv_sdk
  lidar: Livox MID-360                  # 交接文档确认（3D 点云 → pointcloud_to_laserscan → 2D 激光）
  paths:                                # 来自交接文档
    maps: /home/jetson/Scout_mini_navigation/src/my_nav/maps/api_map
    params: /home/jetson/Scout_mini_navigation/src/my_nav/config/tuned2
    pcd: /home/jetson/Scout_mini_navigation/src/FAST_LIO_gravity_align/PCD
    db: /home/jetson/Scout_mini_navigation/src/nav_api/db/nav_api.db
  start_script: src/my_nav/script/start_nav.sh    # 单独启动导航（与前后端无关）
  web_entry_lan: http://192.168.31.135/app/
  web_entry_hotspot: http://192.168.117.6/app/
  data_convention: "/data/project1/YYYYMMDD_场景/；bag 命名 日期_场景_是否成功.bag；中间结果放 debug/"
  status: CONFIRMED
  note: "CURRENT 稳定基线。2026-08-19 双 rosbridge 已部署：客户端 9090、nav_api 内部 19090；完整 Node/Topic/TF/参数清单仍待回填。"
