# 事实源：前端接口（SLAMIBotApp）
# 状态取值：CONFIRMED / NEEDS_CONFIRMATION / UNKNOWN / TODO
# 来源：2026-08-17 分析 SLAMIBotApp 仓库（README / package.json / web/src / msg.md）

frontend:
  repo: https://github.com/electech6/SLAMIBotApp.git
  local_path: "F:\\SLAMIBotApp"
  version: "web/package.json 1.6.3；version.properties VERSION_NAME=1.5.0"

  web:
    framework: React 19 + TypeScript + Vite
    rosbridge_client: roslib 2.1          # 连接 ws://<ip>:9090
    render: Three.js（@react-three/fiber + drei）+ react-konva + antd + zustand
    nav_ui: 私有包 @npu-chenlin/slamibot-navigation-ui（GitHub Packages，构建需 PACKAGES_TOKEN）
    build: npm ci && npm run build:release
    serve: 由 Android WebView 加载；或 nginx 托管

  app:
    platform: Android
    framework: Kotlin + Jetpack Compose + WebView（壳 + 原生能力）
    build: ./build.sh debug|release（Gradle；JDK17 + Android SDK 项目级，见 scripts/setup-android-env.sh）

  ros_server: 192.168.117.6（.env.production）；127.0.0.1（.env.development）
  rosbridge_port: 9090                   # App 端默认；注意与 D360 容器内 19090 不一致（见 rosbridge_profile.yaml）

  # 前端经 rosbridge 通信的 topic（来自 msg.md 与 web/src 组件）
  topics:
    - /rtk/gga       # std_msgs/String（NMEA GPGGA）
    - /rtcm/data     # std_msgs/UInt8MultiArray（RTCM 差分数据）
    - 点云（CBOR 压缩）、里程计、电池/存储/驱动状态、关键帧图像等 —— topic 名待从 web/src 组件回填
  status: CONFIRMED
