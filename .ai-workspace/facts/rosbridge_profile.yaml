# 事实源：rosbridge 接口（前端 ↔ ROS 的边界，protected）
# 状态取值：CONFIRMED / NEEDS_CONFIRMATION / UNKNOWN / TODO
# 这是前后端与 ROS 系统之间的稳定边界，属于 protected interface。
# 来源：2026-08-16 只读分析 d360_nav2D 仓库（docker-entrypoint.sh）

rosbridge:
  package: rosbridge_server             # ros-noetic-rosbridge-server
  transport: websocket                  # rosbridge_websocket
  websocket_port: 19090                 # CONFIRMED：D360 容器 rosrun rosbridge_websocket _port:=19090
  websocket_host: 127.0.0.1             # 容器内；对外经 --network host 暴露
  port_discrepancy: NEEDS_CONFIRMATION
  port_note: |
    ⚠️ 端口不一致：D360 容器 rosbridge=19090（docker-entrypoint.sh），
    但 SLAMIBotApp web 默认连 ws://<ip>:9090（web/src/App.tsx 等）。
    D360 提交历史「改为了19090」暗示端口从 9090 改到 19090，APP 端可能未同步。
    需人工确认实际对接端口（9090 还是 19090），这是前端↔ROS 关键边界，禁止猜测。

  # 前端订阅/发布的 Topic（来自 SLAMIBotApp msg.md 与 web/src，逐条回填）
  topics:
    - { name: /rtk/gga,    msg_type: std_msgs/String,          note: NMEA GPGGA }
    - { name: /rtcm/data,  msg_type: std_msgs/UInt8MultiArray, note: RTCM 差分数据 }
    - { name: NEEDS_CONFIRMATION, note: 点云（CBOR 压缩）、里程计、电池/存储/驱动状态、关键帧图像等，topic 名待从 web/src 组件回填 }
  services: []                          # TODO
  params: []                            # TODO

  # 导航状态 / 任务状态 / 错误码约定
  nav_status:
    encoding: UNKNOWN
    values: []                          # TODO
  task_status:
    encoding: UNKNOWN
    values: []                          # TODO
  error_codes: []                       # TODO

  message_format: UNKNOWN               # TODO：JSON 结构；点云走 CBOR（见 commits）

  # 迁移说明
  migration_note: |
    未来 ROS1→ROS2 迁移时，若 rosbridge 或消息类型变化，必须在本目录
    新建「接口迁移说明」文档，不得直接覆盖本旧协议。
  status: NEEDS_CONFIRMATION
  see_also: "../../interfaces/rosbridge/"
