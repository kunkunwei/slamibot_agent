# 事实源：机器人平台
# 状态取值：CONFIRMED / NEEDS_CONFIRMATION / UNKNOWN / TODO
# 禁止猜测事实值；缺失一律标 UNKNOWN / NEEDS_CONFIRMATION。

robot_profile:
  d360:
    name: D360
    chassis_vendor: 松灵（AgileX）         # 用户确认
    chassis_model: Scout mini             # 用户确认：小车使用松灵 Scout mini
    type: 轮式小车（四轮，差速/滑移转向）   # 具体驱动方式待从仓库核实
    locomotion: 轮式（Scout mini 底盘）
    primary_use: [高校二次开发, 工业巡检]
    environment: 室内为主
    autonomy_level: 非自动驾驶类型导航
    source: "底盘信息为用户 2026-08-16 确认；驱动接口/尺寸/参数待从 d360_nav2D 仓库核实"

    # 计算平台（下位机目标）
    compute_board: Jetson Orin NX
    compute_os: UNKNOWN          # NEEDS_CONFIRMATION：Ubuntu 20.04（与 ROS1 对应）
    ssh_host: 116.148.216.66     # 来源 ~/.ssh/config
    ssh_port: 30046
    ssh_user: root

    # 传感器（来自 d360_nav2D 仓库分析，部分确认）
    sensors:
      lidar: Livox（livox_ros_driver2；3D 点云经 pointcloud_to_laserscan 转 2D 激光）
      imu: Livox 内置 IMU（topic /livox/imu）
      camera: UNKNOWN
      odometry: UNKNOWN                # 底盘里程计，经 CAN（can0 500k）

    # Frame / TF（全部待确认）
    frames:
      base_frame: UNKNOWN
      odom_frame: UNKNOWN
      map_frame: UNKNOWN
      lidar_frame: UNKNOWN

    # 运动能力
    max_speed: UNKNOWN
    dof: UNKNOWN

    # 备注
    note: |
      D360 为当前导航项目（CURRENT）。本 profile 大部分字段待从
      d360_nav2D 仓库（launch/参数/urdf）与 Jetson 实机回填。
